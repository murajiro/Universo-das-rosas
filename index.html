<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jardim das Galáxias Pro</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            width: 100%; height: 100%; 
            background-color: #030008; 
            overflow: hidden; 
            touch-action: none; 
            font-family: 'Inter', sans-serif; 
        }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            display: flex; flex-direction: column; 
            justify-content: flex-end; 
            align-items: center;
            padding: 30px; pointer-events: none; opacity: 0; transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #ui-layer.active { opacity: 1; pointer-events: auto; }

        .content-card {
            max-width: 420px; width: 100%; text-align: center; color: #ffffff;
            background: linear-gradient(180deg, rgba(20, 10, 40, 0.9) 0%, rgba(5, 2, 15, 0.95) 100%);
            padding: 40px; border-radius: 40px; transform: translateY(40px);
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 80px rgba(0,0,0,0.8), inset 0 0 20px rgba(150, 100, 255, 0.1);
            margin-bottom: 20px;
        }
        #ui-layer.active .content-card { transform: translateY(0); }

        .rarity-tag {
            display: inline-block; font-size: 0.65rem; letter-spacing: 4px; text-transform: uppercase;
            padding: 8px 20px; border-radius: 30px; margin-bottom: 25px;
            background: rgba(255,255,255,0.05); color: #c084fc; font-weight: 700;
            border: 1px solid rgba(192, 132, 252, 0.3);
        }
        .rarity-tag.galactico { 
            background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899); 
            color: #fff; box-shadow: 0 0 30px rgba(168, 85, 247, 0.4); border: none;
        }

        h1 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 15px; background: linear-gradient(to bottom, #fff, #b992ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { font-family: 'Playfair Display', serif; font-size: 1.1rem; line-height: 1.8; opacity: 0.85; margin-bottom: 20px; color: #d1d5db; font-style: italic; }
        
        .interaction-hint {
            font-size: 0.7rem; color: #fbcfe8; opacity: 0.8; letter-spacing: 1.5px;
            margin-bottom: 25px; animation: pulse 2.5s infinite ease-in-out;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; text-shadow: 0 0 8px #fbcfe8; } }

        .btn-back {
            background: #ffffff; color: #000; padding: 16px 40px; border-radius: 50px; font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.4s;
            font-weight: 700; border: none; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            pointer-events: auto;
        }
        .btn-back:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <canvas id="universe"></canvas>

    <div id="ui-layer">
        <div class="content-card">
            <div id="rarity-label" class="rarity-tag">COMUM</div>
            <h1 id="flower-name">Nome da Flor</h1>
            <p id="flower-desc">Descrição.</p>
            <div class="interaction-hint">✧ Toque na flor para soprar suas pétalas ✧</div>
            <button class="btn-back" id="btn-back">Voltar ao Espaço</button>
        </div>
    </div>

    <script>
        const flowerData = [
            { id: 'rosa', nome: 'Nebulosa Escarlate', colors: ['#ff0055', '#440011', '#ffaaaa'], aura: 'rgba(255, 0, 85, ', mensagem: "Uma rosa tecida com ventos solares e poeira estelar incandescente." },
            { id: 'girassol', nome: 'Supernova Áurea', colors: ['#ffdd00', '#664400', '#ffffff'], aura: 'rgba(255, 221, 0, ', mensagem: "Seu centro é um buraco negro estável alimentado por pura luz." },
            { id: 'tulipa', nome: 'Cristal de Eventos', colors: ['#00ffff', '#003344', '#ccffff'], aura: 'rgba(0, 255, 255, ', mensagem: "Uma forma geométrica perfeita que pulsa na frequência do vácuo." },
            { id: 'lirio', nome: 'Espirito Cósmico', colors: ['#ffffff', '#220044', '#a855f7'], aura: 'rgba(168, 85, 247, ', mensagem: "Pétalas etéreas que existem em múltiplas dimensões simultaneamente." },
            { id: 'margarida', nome: 'Pulsar de Prata', colors: ['#e2e8f0', '#94a3b8', '#ffffff'], aura: 'rgba(226, 232, 240, ', mensagem: "Cada pequena pétala é uma batida rítmica de uma estrela distante." },
            { id: 'dalia', nome: 'Fractal Primevo', colors: ['#f472b6', '#701a75', '#fbcfe8'], aura: 'rgba(244, 114, 182, ', mensagem: "A complexidade infinita da vida codificada em padrões de energia." },
            { id: 'lotus', nome: 'Zenith do Vácuo', colors: ['#4c1d95', '#0f172a', '#c084fc'], aura: 'rgba(124, 58, 237, ', mensagem: "Onde o silêncio se torna beleza e a escuridão floresce." }
        ];

        const BLUE_ROSE_DATA = {
            id: 'blue-rose', nome: 'Rosa do Impossível', colors: ['#3b82f6', '#1d4ed8', '#ffffff'], aura: 'rgba(59, 130, 246, ',
            mensagem: "A raridade absoluta. Um milagre matemático no meio do caos infinito.",
            rarity: 'SINGULARIDADE'
        };

        const canvas = document.getElementById('universe');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height, cx, cy;
        let cam = { x: 0, y: 0, zoom: 0.52, targetX: 0, targetY: 0, targetZoom: 0.52 };
        let vel = { x: 0, y: 0 };
        let state = 'EXPLORING';
        let activePlanet = null;
        let bloomProgress = 0;
        let particles = [];
        let trailParticles = [];
        let idleTime = 0;
        let activeConstellation = null; 
        
        const chunks = new Map();
        const CHUNK_SIZE = 1600;

        // Formas românticas para as constelações (Coordenadas relativas de -1 a 1)
        const constellShapes = [
            // Coração
            { name: "Coração", pts: [{x: 0, y: 0.6}, {x: -0.6, y: -0.1}, {x: -0.4, y: -0.6}, {x: 0, y: -0.3}, {x: 0.4, y: -0.6}, {x: 0.6, y: -0.1}, {x: 0, y: 0.6}] },
            // Alanna (Representação simplificada em pontos)
            { name: "Alanna", pts: [{x: -0.8, y: 0.4}, {x: -0.6, y: -0.4}, {x: -0.4, y: 0.4}, {x: -0.7, y: 0}, {x: -0.5, y: 0}, {x: -0.2, y: -0.4}, {x: -0.2, y: 0.4}, {x: 0, y: 0.4}, {x: 0.2, y: -0.4}, {x: 0.2, y: 0.4}, {x: 0.4, y: 0.4}, {x: 0.6, y: -0.4}, {x: 0.6, y: 0.4}, {x: 0.8, y: 0.4}] },
            // Eu te amo
            { name: "Love", pts: [{x: -0.6, y: -0.4}, {x: -0.6, y: 0.4}, {x: -0.3, y: 0.4}, {x: -0.1, y: 0}, {x: 0.1, y: 0.4}, {x: 0.3, y: 0.4}, {x: 0.3, y: -0.4}, {x: 0, y: -0.6}] },
            // Símbolo do Infinito
            { name: "Infinito", pts: [{x: 0, y: 0}, {x: 0.6, y: -0.4}, {x: 0.9, y: 0}, {x: 0.6, y: 0.4}, {x: 0, y: 0}, {x: -0.6, y: -0.4}, {x: -0.9, y: 0}, {x: -0.6, y: 0.4}, {x: 0, y: 0}] }
        ];

        function resize() {
            width = window.innerWidth; height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr; canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            cx = width / 2; cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        function createPRNG(x, y) {
            let seed = (x * 374761393 + y * 668265263) >>> 0;
            return () => {
                seed = (seed + 0x9E3779B9) | 0;
                let t = seed ^ (seed >>> 16);
                t = Math.imul(t, 0x21f0aaad);
                t = t ^ (t >>> 15);
                t = Math.imul(t, 0x735a2d97);
                seed = t = t ^ (t >>> 15);
                return (t >>> 0) / 4294967296;
            };
        }

        function generateChunk(cx_idx, cy_idx) {
            let stars = []; let planets = []; let nebulae = [];
            const random = createPRNG(cx_idx, cy_idx);
            
            if(random() < 0.4) {
                nebulae.push({
                    x: cx_idx * CHUNK_SIZE + random() * CHUNK_SIZE,
                    y: cy_idx * CHUNK_SIZE + random() * CHUNK_SIZE,
                    size: 300 + random() * 400,
                    isHeart: random() < 0.45, 
                    hue: random() * 30 + 330, // Tons rosados e vermelhos
                    phase: random() * Math.PI * 2
                });
            }

            for(let i=0; i<120; i++) {
                stars.push({ 
                    x: cx_idx * CHUNK_SIZE + random() * CHUNK_SIZE, 
                    y: cy_idx * CHUNK_SIZE + random() * CHUNK_SIZE, 
                    z: random() * 0.8 + 0.1, size: random() * 2 + 0.2, phase: random() * Math.PI * 2 
                });
            }
            if(random() < 0.7) {
                const isBlue = random() < 0.015;
                if(isBlue) {
                    planets.push({ ...BLUE_ROSE_DATA, x: cx_idx * CHUNK_SIZE + CHUNK_SIZE * 0.5, y: cy_idx * CHUNK_SIZE + CHUNK_SIZE * 0.5, radius: 50, seed: random() * 1000, rotSpeed: 0.001, quantity: 1, isSpecial: true, hasRing: true });
                } else {
                    let typeIdx = Math.floor(random() * flowerData.length);
                    let roll = random();
                    let qty = 1, rarity = "COMUM";
                    if(roll > 0.96) { qty = 6; rarity = "SISTEMA FLORAL"; }
                    else if(roll > 0.85) { qty = 3; rarity = "LENDÁRIO"; }
                    else if(roll > 0.65) { qty = 2; rarity = "RARO"; }
                    planets.push({
                        ...flowerData[typeIdx],
                        x: cx_idx * CHUNK_SIZE + random() * CHUNK_SIZE,
                        y: cy_idx * CHUNK_SIZE + random() * CHUNK_SIZE,
                        radius: 40 + random() * 30, seed: random() * 1000,
                        rotSpeed: (random()-0.5) * 0.004, quantity: qty, rarity: rarity,
                        hasRing: random() > 0.8
                    });
                }
            }
            return { stars, planets, nebulae };
        }

        // --- SISTEMAS DE DESENHO ARTÍSTICO ---

        function drawRose(ctx, r, colors, time) {
            for(let l=0; l<6; l++) {
                let count = 5 + l;
                let lr = r * (1 - l*0.15);
                ctx.save();
                ctx.rotate(time * 0.0004 * (l+1));
                for(let i=0; i<count; i++) {
                    ctx.save();
                    ctx.rotate(i * Math.PI*2/count);
                    let grad = ctx.createRadialGradient(0,0,0,0,lr,lr);
                    grad.addColorStop(0, colors[0]); grad.addColorStop(1, colors[1]);
                    ctx.fillStyle = grad;
                    ctx.globalAlpha = 1 - (l*0.1);
                    ctx.beginPath();
                    ctx.moveTo(0,0);
                    ctx.bezierCurveTo(lr, -lr*0.6, lr*1.5, lr, 0, lr);
                    ctx.bezierCurveTo(-lr*1.5, lr, -lr, -lr*0.6, 0, 0);
                    ctx.fill();
                    ctx.restore();
                }
                ctx.restore();
            }
        }

        function drawSunflower(ctx, r, colors, time) {
            for(let i=0; i<32; i++) {
                let ang = i * Math.PI*2/32;
                let len = r * (1.1 + Math.sin(time*0.01 + i)*0.1);
                ctx.save();
                ctx.rotate(ang);
                ctx.beginPath(); ctx.moveTo(0,0);
                ctx.quadraticCurveTo(r*0.3, len*0.5, 0, len);
                ctx.quadraticCurveTo(-r*0.3, len*0.5, 0, 0);
                let g = ctx.createLinearGradient(0,0,0,len);
                g.addColorStop(0, colors[1]); g.addColorStop(1, colors[0]);
                ctx.fillStyle = g; ctx.fill();
                ctx.restore();
            }
            ctx.beginPath(); ctx.arc(0,0,r*0.4,0,Math.PI*2);
            ctx.fillStyle = "#000"; ctx.fill();
        }

        function drawTulip(ctx, r, colors) {
            const drawLeaf = (rot, size, color) => {
                ctx.save(); ctx.rotate(rot);
                ctx.beginPath(); ctx.moveTo(0,0);
                ctx.bezierCurveTo(size, -size*0.5, size*0.5, -size*1.8, 0, -size*2);
                ctx.bezierCurveTo(-size*0.5, -size*1.8, -size, -size*0.5, 0, 0);
                ctx.fillStyle = color; ctx.fill();
                ctx.restore();
            };
            drawLeaf(0.3, r, colors[1]); drawLeaf(-0.3, r, colors[1]); drawLeaf(0, r*1.1, colors[0]);
        }

        function drawLily(ctx, r, colors, time) {
            for(let i=0; i<6; i++) {
                ctx.save(); ctx.rotate(i * Math.PI/3);
                ctx.beginPath(); ctx.moveTo(0,0);
                ctx.bezierCurveTo(r, r, -r, r*2, 0, r*2.5);
                ctx.strokeStyle = colors[2]; ctx.lineWidth = r*0.1; ctx.stroke();
                ctx.restore();
            }
        }

        function drawDaisy(ctx, r, colors, time) {
            for(let i=0; i<12; i++) {
                ctx.save(); ctx.rotate(i * Math.PI/6 + time*0.0005);
                ctx.beginPath(); ctx.ellipse(0, r*0.8, r*0.15, r*0.7, 0, 0, Math.PI*2);
                ctx.fillStyle = "#fff"; ctx.fill();
                ctx.restore();
            }
            ctx.beginPath(); ctx.arc(0,0,r*0.35,0,Math.PI*2);
            ctx.fillStyle = colors[1]; ctx.fill();
        }

        function drawDahlia(ctx, r, colors, time) {
            for(let l=0; l<3; l++) {
                let count = 12 + l*6;
                let lr = r * (1 - l*0.25);
                ctx.save(); ctx.rotate(l * 0.5 + time*0.001);
                for(let i=0; i<count; i++) {
                    ctx.rotate(Math.PI*2/count);
                    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(lr*0.3, lr); ctx.lineTo(-lr*0.3, lr);
                    ctx.fillStyle = l%2==0 ? colors[0] : colors[2]; ctx.fill();
                }
                ctx.restore();
            }
        }

        function drawLotus(ctx, r, colors, time) {
            for(let l=3; l>=1; l--) {
                let count = 8;
                let lr = r * (l/3);
                ctx.save(); ctx.rotate(l * 0.4 + time*0.0008);
                for(let i=0; i<count; i++) {
                    ctx.rotate(Math.PI*2/count);
                    ctx.beginPath(); ctx.moveTo(0,0);
                    ctx.quadraticCurveTo(lr*0.8, -lr*0.2, lr, lr);
                    ctx.quadraticCurveTo(-lr*0.2, lr*0.8, 0, 0);
                    ctx.fillStyle = l%2==0 ? colors[0] : colors[2]; ctx.fill();
                }
                ctx.restore();
            }
        }

        function spawnPetals(p, startX = null, startY = null) {
            for(let i=0; i<20; i++) {
                particles.push({
                    x: startX ? (startX - cx)/cam.zoom + cam.x + (Math.random()-0.5)*30 : p.x + (Math.random()-0.5)*100,
                    y: startY ? (startY - cy)/cam.zoom + cam.y + (Math.random()-0.5)*30 : p.y - 300,
                    vx: (Math.random()-0.5)*8, vy: Math.random()*3 + 1,
                    size: Math.random()*8 + 4, color: p.colors[0],
                    life: 1.2, rot: Math.random()*Math.PI*2, rotV: (Math.random()-0.5)*0.1
                });
            }
        }

        function drawFlower(ctx, p, size, time) {
            ctx.save();
            let heartbeat = Math.pow(Math.sin(time * 0.003), 4) + Math.pow(Math.sin(time * 0.003 + 0.3), 4);
            ctx.shadowBlur = (20 + heartbeat * 30) * bloomProgress;
            ctx.shadowColor = p.colors[0];
            
            switch(p.id) {
                case 'rosa': case 'blue-rose': drawRose(ctx, size, p.colors, time); break;
                case 'girassol': drawSunflower(ctx, size, p.colors, time); break;
                case 'tulipa': drawTulip(ctx, size, p.colors); break;
                case 'lirio': drawLily(ctx, size, p.colors, time); break;
                case 'margarida': drawDaisy(ctx, size, p.colors, time); break;
                case 'dalia': drawDahlia(ctx, size, p.colors, time); break;
                case 'lotus': drawLotus(ctx, size, p.colors, time); break;
            }
            ctx.restore();
        }

        function drawStem(ctx, x, y, size, bloom, time, angleOffset) {
            const baseLen = size * 5.5 * bloom;
            const sway = Math.sin(time * 0.001 + angleOffset) * 12 * bloom;
            let tx = x + (angleOffset * size * 2.5) * bloom + sway;
            let ty = y - baseLen;
            ctx.beginPath(); ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x + sway*0.4, y - baseLen*0.5, tx, ty);
            let stemGrad = ctx.createLinearGradient(x, y, tx, ty);
            stemGrad.addColorStop(0, "rgba(20, 10, 30, 0)"); 
            stemGrad.addColorStop(1, "rgba(100, 255, 150, "+bloom*0.6+")");
            ctx.strokeStyle = stemGrad; ctx.lineWidth = size * 0.1 * bloom; ctx.lineCap = 'round'; ctx.stroke();
            return { tx, ty, rot: (angleOffset * 0.15) };
        }

        function drawPlanet(ctx, p, time, cam) {
            let px = cx + (p.x - cam.x) * cam.zoom;
            let py = cy + (p.y - cam.y) * cam.zoom;
            let pr = p.radius * cam.zoom;
            
            if(px < -pr*15 || px > width+pr*15 || py < -pr*15 || py > height+pr*15) return;

            let isActive = (activePlanet === p);
            let pAlpha = isActive ? Math.max(0, 1 - bloomProgress * 2) : 1;

            if(pAlpha > 0.01) {
                ctx.save(); ctx.translate(px, py);
                let atm = ctx.createRadialGradient(0,0, pr*0.5, 0,0, pr*2.2);
                atm.addColorStop(0, p.aura + (0.35 * pAlpha) + ")"); atm.addColorStop(1, p.aura + "0)");
                ctx.fillStyle = atm; ctx.beginPath(); ctx.arc(0,0, pr*2.2, 0, Math.PI*2); ctx.fill();
                
                ctx.rotate(time * p.rotSpeed);
                let core = ctx.createRadialGradient(-pr*0.3, -pr*0.3, 0, 0,0, pr);
                core.addColorStop(0, "#fff"); core.addColorStop(0.2, p.colors[0]); core.addColorStop(1, "#0a0510");
                ctx.fillStyle = core; ctx.beginPath(); ctx.arc(0,0, pr, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }

            if(isActive && bloomProgress > 0.01) {
                ctx.save(); ctx.translate(px, py);
                let fSize = pr * 1.4;
                for(let i=0; i<p.quantity; i++) {
                    let offset = (p.quantity > 1) ? (i - (p.quantity-1)/2) * 0.6 : 0;
                    const { tx, ty, rot } = drawStem(ctx, 0, 0, fSize, bloomProgress, time, offset);
                    ctx.save(); ctx.translate(tx, ty); ctx.rotate(rot); ctx.scale(bloomProgress, bloomProgress);
                    drawFlower(ctx, p, fSize, time);
                    ctx.restore();
                }
                ctx.restore();
            }
        }

        function drawBackground() {
            let bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, width);
            bgGrad.addColorStop(0, '#090514'); bgGrad.addColorStop(1, '#020005');
            ctx.fillStyle = bgGrad; ctx.fillRect(0,0, width, height);
        }

        function loop(time) {
            drawBackground();
            
            if (Math.abs(vel.x) < 0.1 && Math.abs(vel.y) < 0.1 && !isDown && state === 'EXPLORING') {
                idleTime++;
            } else {
                idleTime = 0;
                activeConstellation = null; 
            }

            if(state === 'ZOOMING') {
                cam.x += (cam.targetX - cam.x) * 0.08;
                cam.y += (cam.targetY - cam.y) * 0.08;
                cam.zoom += (cam.targetZoom - cam.zoom) * 0.08;
                bloomProgress += (1 - bloomProgress) * 0.08;
            } else if(state === 'RETURNING') {
                cam.zoom += (0.52 - cam.zoom) * 0.1;
                bloomProgress += (0 - bloomProgress) * 0.12;
                if(bloomProgress < 0.01) { state = 'EXPLORING'; activePlanet = null; }
            } else {
                cam.x += vel.x; cam.y += vel.y; vel.x *= 0.95; vel.y *= 0.95;
            }

            let sX = Math.floor((cam.x - cx/cam.zoom)/CHUNK_SIZE), eX = Math.ceil((cam.x + cx/cam.zoom)/CHUNK_SIZE);
            let sY = Math.floor((cam.y - cy/cam.zoom)/CHUNK_SIZE), eY = Math.ceil((cam.y + cy/cam.zoom)/CHUNK_SIZE);

            let visibleStars = [];

            for(let x=sX; x<=eX; x++) {
                for(let y=sY; y<=eY; y++) {
                    let key = `${x},${y}`; let chunk = chunks.get(key);
                    if(!chunk) { chunk = generateChunk(x,y); chunks.set(key, chunk); }
                    
                    chunk.nebulae.forEach(n => {
                        let nx = cx + (n.x - cam.x) * cam.zoom;
                        let ny = cy + (n.y - cam.y) * cam.zoom;
                        let nSize = n.size * cam.zoom;
                        if(nx > -nSize && nx < width+nSize && ny > -nSize && ny < height+nSize) {
                            let pulse = Math.sin(time * 0.001 + n.phase) * 0.15 + 1;
                            if(n.isHeart) {
                                ctx.save(); ctx.translate(nx, ny);
                                ctx.scale(pulse, pulse);
                                ctx.beginPath();
                                let topY = -nSize*0.3;
                                ctx.moveTo(0, topY);
                                ctx.bezierCurveTo(nSize*0.5, -nSize*0.8, nSize*1.2, nSize*0.2, 0, nSize*0.9);
                                ctx.bezierCurveTo(-nSize*1.2, nSize*0.2, -nSize*0.5, -nSize*0.8, 0, topY);
                                
                                let nGrad = ctx.createRadialGradient(0,0,0,0,0,nSize);
                                nGrad.addColorStop(0, `hsla(${n.hue}, 90%, 65%, 0.15)`);
                                nGrad.addColorStop(0.5, `hsla(${n.hue}, 80%, 50%, 0.04)`);
                                nGrad.addColorStop(1, 'transparent');
                                
                                ctx.fillStyle = nGrad;
                                ctx.shadowBlur = nSize * 0.6; ctx.shadowColor = `hsla(${n.hue}, 100%, 70%, 0.2)`;
                                ctx.fill(); ctx.restore();
                            } else {
                                let grad = ctx.createRadialGradient(nx, ny, 0, nx, ny, nSize * pulse);
                                grad.addColorStop(0, `hsla(${n.hue}, 60%, 40%, 0.06)`); grad.addColorStop(1, 'transparent');
                                ctx.fillStyle = grad; ctx.fillRect(nx-nSize*2, ny-nSize*2, nSize*4, nSize*4);
                            }
                        }
                    });

                    chunk.stars.forEach(s => {
                        let sx = cx + (s.x - cam.x) * s.z * cam.zoom;
                        let sy = cy + (s.y - cam.y) * s.z * cam.zoom;
                        if(sx > -10 && sx < width+10 && sy > -10 && sy < height+10) {
                            ctx.globalAlpha = 0.3 + Math.sin(time*0.001+s.phase)*0.3;
                            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(sx, sy, s.size * cam.zoom, 0, Math.PI*2); ctx.fill();
                            if (idleTime > 80) visibleStars.push({x: sx, y: sy, original: s});
                        }
                    });
                    ctx.globalAlpha = 1;
                    chunk.planets.forEach(p => drawPlanet(ctx, p, time, cam));
                }
            }

            // Gerar Constelação Mágica
            if (idleTime === 100 && visibleStars.length > 10) {
                let validCenters = visibleStars.filter(s => s.x > width*0.2 && s.x < width*0.8 && s.y > height*0.2 && s.y < height*0.8);
                let centerPoint = validCenters.length > 0 ? validCenters[Math.floor(Math.random() * validCenters.length)] : visibleStars[0];
                
                let shapeObj = constellShapes[Math.floor(Math.random() * constellShapes.length)];
                let scale = 200 + Math.random() * 100; 
                
                let mappedStars = [];
                for(let pt of shapeObj.pts) {
                    let targetX = centerPoint.x + pt.x * scale;
                    let targetY = centerPoint.y + pt.y * scale;
                    let closest = null; let minDist = Infinity;
                    for(let s of visibleStars) {
                        let d = Math.hypot(s.x - targetX, s.y - targetY);
                        if(d < minDist) { minDist = d; closest = s; }
                    }
                    if(closest) mappedStars.push(closest);
                }
                activeConstellation = { stars: mappedStars, label: shapeObj.name };
            }

            // Desenhar Constelação Ativa
            if (idleTime > 100 && activeConstellation) {
                let opacity = Math.min(1, (idleTime-100)*0.01) * 0.7;
                ctx.strokeStyle = `rgba(220, 200, 255, ${opacity})`;
                ctx.lineWidth = 1.2;
                ctx.shadowBlur = 20; ctx.shadowColor = `rgba(180, 150, 255, ${opacity})`;
                
                ctx.beginPath();
                for(let i=0; i<activeConstellation.stars.length; i++) {
                    let s = activeConstellation.stars[i];
                    if(i===0) ctx.moveTo(s.x, s.y);
                    else ctx.lineTo(s.x, s.y);
                }
                ctx.stroke();
                
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity * 1.5})`;
                for(let s of activeConstellation.stars) {
                    ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, Math.PI*2); ctx.fill();
                }

                // Texto da Constelação
                if (opacity > 0.5) {
                    ctx.font = "italic 14px 'Playfair Display'";
                    ctx.textAlign = "center";
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity - 0.3})`;
                    ctx.fillText(activeConstellation.label, activeConstellation.stars[0].x, activeConstellation.stars[0].y - 20);
                }
                ctx.shadowBlur = 0;
            }

            trailParticles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.015;
                if(p.life <= 0) trailParticles.splice(i, 1);
                else {
                    ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
                }
            });
            ctx.globalAlpha = 1;

            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.rot += p.rotV; p.life -= 0.005;
                if(p.life <= 0) { particles.splice(i, 1); continue; }
                let px = cx + (p.x - cam.x) * cam.zoom; let py = cy + (p.y - cam.y) * cam.zoom;
                ctx.save(); ctx.translate(px, py); ctx.rotate(p.rot); ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.ellipse(0,0, p.size*cam.zoom, (p.size/2)*cam.zoom, 0, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }
            requestAnimationFrame(loop);
        }

        let isDown = false, lastPos = {x:0, y:0}, startPos = {x:0, y:0};
        window.addEventListener('pointerdown', e => {
            if(state === 'ZOOMING' && activePlanet && !e.target.closest('.content-card')) {
                spawnPetals(activePlanet, e.clientX, e.clientY);
                return;
            }
            if(state !== 'EXPLORING' || e.target.closest('.content-card')) return;
            isDown = true; lastPos = startPos = {x: e.clientX, y: e.clientY}; vel = {x:0, y:0};
            idleTime = 0; activeConstellation = null;
        });
        window.addEventListener('pointermove', e => {
            idleTime = 0; activeConstellation = null;
            if(!isDown) return;
            let dx = e.clientX - lastPos.x, dy = e.clientY - lastPos.y;
            cam.x -= dx/cam.zoom; cam.y -= dy/cam.zoom;
            vel = {x: -dx*0.2, y: -dy*0.2}; lastPos = {x:e.clientX, y:e.clientY};

            if (state === 'EXPLORING') {
                trailParticles.push({
                    x: e.clientX, y: e.clientY,
                    vx: (Math.random()-0.5), vy: (Math.random()-0.5),
                    life: 1, color: `hsla(${Math.random()*360}, 80%, 70%, 0.8)`
                });
            }
        });
        window.addEventListener('pointerup', e => {
            if(!isDown) return; isDown = false;
            if(Math.hypot(e.clientX - startPos.x, e.clientY - startPos.y) < 15) checkClick(e.clientX, e.clientY);
        });

        function checkClick(mx, my) {
            let sX = Math.floor((cam.x - cx/cam.zoom)/CHUNK_SIZE), eX = Math.ceil((cam.x + cx/cam.zoom)/CHUNK_SIZE);
            let sY = Math.floor((cam.y - cy/cam.zoom)/CHUNK_SIZE), eY = Math.ceil((cam.y + cy/cam.zoom)/CHUNK_SIZE);

            for(let x=sX; x<=eX; x++) {
                for(let y=sY; y<=eY; y++) {
                    let chunk = chunks.get(`${x},${y}`);
                    if(!chunk) continue;
                    for(let p of chunk.planets) {
                        let px = cx + (p.x - cam.x) * cam.zoom; 
                        let py = cy + (p.y - cam.y) * cam.zoom;
                        if(Math.hypot(mx-px, my-py) < p.radius * cam.zoom * 4) {
                            activePlanet = p; 
                            state = 'ZOOMING';
                            
                            const targetZoom = (height * 0.045) / p.radius;
                            cam.targetZoom = targetZoom;
                            cam.targetX = p.x;
                            cam.targetY = p.y - (height * 0.15) / targetZoom;

                            const rl = document.getElementById('rarity-label');
                            rl.innerText = p.rarity;
                            rl.className = 'rarity-tag' + (p.id === 'blue-rose' ? ' galactico' : '');
                            document.getElementById('flower-name').innerText = p.nome;
                            document.getElementById('flower-desc').innerText = p.mensagem;
                            document.getElementById('ui-layer').classList.add('active');

                            if(p.id === 'blue-rose') spawnPetals(p);
                            return;
                        }
                    }
                }
            }
        }

        document.getElementById('btn-back').onclick = (e) => {
            e.stopPropagation();
            state = 'RETURNING'; 
            document.getElementById('ui-layer').classList.remove('active');
            particles = [];
        };

        requestAnimationFrame(loop);
    </script>
</body>
</html>
