<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jardim das Galáxias</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            width: 100%; height: 100%; 
            background-color: #020105; 
            overflow: hidden; 
            touch-action: none; 
            overscroll-behavior: none; 
            font-family: 'Inter', sans-serif; 
        }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            display: flex; flex-direction: column; 
            justify-content: flex-end; 
            align-items: center;
            padding: 20px; pointer-events: none; opacity: 0; transition: opacity 0.6s ease;
        }
        #ui-layer.active { opacity: 1; pointer-events: auto; }

        .content-card {
            max-width: 340px; width: 95%; text-align: center; color: #ffffff;
            background: linear-gradient(135deg, rgba(15, 10, 25, 0.9) 0%, rgba(5, 5, 10, 0.8) 100%);
            padding: 20px; border-radius: 24px; transform: translateY(20px);
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        #ui-layer.active .content-card { transform: translateY(0); }

        .rarity-tag {
            display: inline-block; font-size: 0.6rem; letter-spacing: 1.5px; text-transform: uppercase;
            padding: 4px 12px; border-radius: 20px; margin-bottom: 12px;
            background: rgba(255,255,255,0.08); color: #ffd700; font-weight: 700;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .rarity-tag.galactico { 
            background: linear-gradient(90deg, #ff00cc, #3333ff, #00f2ff); 
            color: #fff; box-shadow: 0 0 15px rgba(255, 0, 204, 0.5); border: none;
            animation: glow-move 3s infinite alternate;
        }
        @keyframes glow-move { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(30deg); } }
        
        .rarity-tag.special { background: rgba(0, 242, 255, 0.15); color: #00f2ff; border: 1px solid rgba(0, 242, 255, 0.4); }

        h1 { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 8px; color: #fff; }
        p { font-family: 'Playfair Display', serif; font-size: 0.85rem; line-height: 1.5; opacity: 0.85; margin-bottom: 15px; color: #e0faff; font-style: italic; }
        
        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff; padding: 10px 24px; border-radius: 30px; font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; transition: 0.3s;
        }
        .btn-back:active { background: rgba(255, 255, 255, 0.25); transform: scale(0.95); }
    </style>
</head>
<body>

    <canvas id="universe"></canvas>

    <div id="ui-layer">
        <div class="content-card">
            <div id="rarity-label" class="rarity-tag">COMUM</div>
            <h1 id="flower-name">Nome da Flor</h1>
            <p id="flower-desc">Descrição.</p>
            <button class="btn-back" id="btn-back">Explorar Mais</button>
        </div>
    </div>

    <script>
        const flowerData = [
            { id: 'rosa', nome: 'Rosa de Plasma', colors: ['#ff1a4a', '#4a0010', '#ffccd5'], aura: 'rgba(255, 26, 74, ', mensagem: "Uma nebulosa em forma de pétalas que queima com o calor de mil sóis." },
            { id: 'girassol', nome: 'Pulsar Dourado', colors: ['#ffcc00', '#4d3300', '#fff9e6'], aura: 'rgba(255, 204, 0, ', mensagem: "As sementes deste girassol são anãs brancas colidindo em harmonia." },
            { id: 'tulipa', nome: 'Cálice de Quasar', colors: ['#00f2ff', '#004d4d', '#e6ffff'], aura: 'rgba(0, 242, 255, ', mensagem: "Uma flor que dobra o tempo e o espaço dentro de seu brilho ciano." },
            { id: 'lirio', nome: 'Lírio de Antimatéria', colors: ['#ffffff', '#2a0052', '#d4a0ff'], aura: 'rgba(212, 160, 255, ', mensagem: "Suas pétalas puras desafiam a lógica da matéria convencional." },
            { id: 'margarida', nome: 'Margarida de Nêutrons', colors: ['#f0f0f0', '#ffeb3b', '#ffffff'], aura: 'rgba(255, 255, 255, ', mensagem: "Densidade infinita em pétalas brancas, orbitando um núcleo de energia pura." },
            { id: 'dalia', nome: 'Dália de Singularidade', colors: ['#e91e63', '#311b92', '#ff80ab'], aura: 'rgba(233, 30, 99, ', mensagem: "Cada camada de pétalas representa uma dimensão oculta do multiverso." },
            { id: 'lotus', nome: 'Lótus do Vácuo', colors: ['#2a2a2a', '#6a1b9a', '#e1bee7'], aura: 'rgba(106, 27, 154, ', mensagem: "Ela floresce onde não existe nada, alimentando-se do silêncio cósmico." }
        ];

        const BLUE_ROSE_DATA = {
            id: 'blue-rose', nome: 'Rosa do Impossível', colors: ['#00f2ff', '#002244', '#ffffff'], aura: 'rgba(0, 242, 255, ',
            mensagem: "A rosa azul simboliza o impossível. Por ti, farei o impossível infinitas vezes.",
            rarity: 'SINGULARIDADE'
        };

        const canvas = document.getElementById('universe');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height, cx, cy;
        let cam = { x: 0, y: 0, zoom: 0.8, targetX: 0, targetY: 0, targetZoom: 0.8 };
        let vel = { x: 0, y: 0 };
        let state = 'EXPLORING';
        let activePlanet = null;
        let bloomProgress = 0;
        const chunks = new Map();
        const CHUNK_SIZE = 1400;

        function resize() {
            width = window.innerWidth; height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr; canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            cx = width / 2; cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        function createPRNG(x, y) {
            let seed = (x * 374761393 + y * 668265263) >>> 0;
            return () => {
                seed = (seed + 0x9E3779B9) | 0;
                let t = seed ^ (seed >>> 16);
                t = Math.imul(t, 0x21f0aaad);
                t = t ^ (t >>> 15);
                t = Math.imul(t, 0x735a2d97);
                seed = t = t ^ (t >>> 15);
                return (t >>> 0) / 4294967296;
            };
        }

        function generateChunk(cx_idx, cy_idx) {
            let stars = []; let planets = []; 
            const random = createPRNG(cx_idx, cy_idx);
            
            for(let i=0; i<60; i++) {
                stars.push({ 
                    x: cx_idx * CHUNK_SIZE + random() * CHUNK_SIZE, 
                    y: cy_idx * CHUNK_SIZE + random() * CHUNK_SIZE, 
                    z: random() * 0.7 + 0.1, 
                    size: random() * 1.2 + 0.2, 
                    phase: random() * Math.PI * 2 
                });
            }

            if(random() < 0.6) {
                const isBlue = random() < 0.012;
                if(isBlue) {
                    planets.push({ ...BLUE_ROSE_DATA, x: cx_idx * CHUNK_SIZE + CHUNK_SIZE * 0.5, y: cy_idx * CHUNK_SIZE + CHUNK_SIZE * 0.5, radius: 45, seed: random() * 1000, rotSpeed: 0.001, quantity: 1, isSpecial: true, hasRing: true });
                } else {
                    let typeIdx = Math.floor(random() * flowerData.length);
                    let roll = random();
                    let qty = 1, rarity = "COMUM";
                    if(roll > 0.95) { qty = 5; rarity = "JARDIM GALÁCTICO"; }
                    else if(roll > 0.82) { qty = 3; rarity = "LENDÁRIO"; }
                    else if(roll > 0.60) { qty = 2; rarity = "INCOMUM"; }

                    planets.push({
                        ...flowerData[typeIdx],
                        x: cx_idx * CHUNK_SIZE + random() * CHUNK_SIZE,
                        y: cy_idx * CHUNK_SIZE + random() * CHUNK_SIZE,
                        radius: 35 + random() * 25, seed: random() * 1000,
                        rotSpeed: (random()-0.5) * 0.003, quantity: qty, rarity: rarity,
                        hasRing: random() > 0.85
                    });
                }
            }
            return { stars, planets };
        }

        function drawPetal(ctx, r, color1, color2, color3, cp1, cp2) {
            ctx.beginPath(); ctx.moveTo(0, 0);
            ctx.bezierCurveTo(r * cp1.x, -r * cp1.y, r * cp2.x, r * cp2.y, 0, r);
            ctx.bezierCurveTo(-r * cp2.x, r * cp2.y, -r * cp1.x, -r * cp1.y, 0, 0);
            let g = ctx.createRadialGradient(0, 0, 0, 0, r*0.5, r);
            g.addColorStop(0, color3 || color2); g.addColorStop(0.5, color2); g.addColorStop(1, color1);
            ctx.fillStyle = g; ctx.fill();
        }

        function drawRose(ctx, r, colors) {
            for(let l=0; l<4; l++) {
                let pc = 4 + l*2; let lr = r * (1 - l*0.2);
                ctx.globalAlpha = 1 - l*0.15;
                for(let i=0; i<pc; i++) {
                    ctx.save(); ctx.rotate((i * Math.PI*2/pc) + l*0.7);
                    drawPetal(ctx, lr, colors[0], colors[1], colors[2], {x: 1.3, y: 0.5}, {x: 1.5, y: 1.0});
                    ctx.restore();
                }
            }
            ctx.globalAlpha = 1;
        }

        function drawFlower(ctx, p, size, time) {
            ctx.save();
            if(p.id === 'blue-rose') {
                ctx.shadowBlur = (10 + Math.sin(time*0.004)*5) * bloomProgress;
                ctx.shadowColor = p.colors[0];
                drawRose(ctx, size, p.colors);
            }
            else if(p.id === 'margarida') {
                for(let i=0; i<16; i++) {
                    ctx.save(); ctx.rotate(i * Math.PI/8);
                    drawPetal(ctx, size, p.colors[0], "#ccc", "#fff", {x: 0.2, y: 0.1}, {x: 0.3, y: 1.1});
                    ctx.restore();
                }
                ctx.beginPath(); ctx.arc(0,0,size*0.25,0,Math.PI*2); ctx.fillStyle = p.colors[1]; ctx.fill();
            } else {
                drawRose(ctx, size, p.colors);
            }
            ctx.restore();
        }

        function drawStem(ctx, x, y, size, bloom, time, angleOffset, isBouquet) {
            const baseLen = size * 2.5 * bloom;
            const sway = Math.sin(time * 0.001 + angleOffset) * 8 * bloom;
            let tx = x + (angleOffset * size * (isBouquet ? 2.0 : 1.2)) * bloom + sway;
            let ty = y - baseLen;
            
            ctx.beginPath(); ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x + sway*0.5, y - baseLen*0.5, tx, ty);
            ctx.strokeStyle = "rgba(60, 120, 60, "+bloom+")";
            ctx.lineWidth = size * 0.1 * bloom;
            ctx.lineCap = 'round';
            ctx.stroke();
            return { tx, ty, rot: (angleOffset * 0.4) };
        }

        function drawPlanet(ctx, p, time, cam) {
            let px = cx + (p.x - cam.x) * cam.zoom;
            let py = cy + (p.y - cam.y) * cam.zoom;
            let pr = p.radius * cam.zoom;
            if(px < -pr*4 || px > width+pr*4 || py < -pr*4 || py > height+pr*4) return;

            let isActive = (activePlanet === p);
            let pAlpha = isActive ? Math.max(0, 1 - bloomProgress * 3) : 1;

            if(pAlpha > 0.01) {
                ctx.save(); ctx.translate(px, py);
                if(p.hasRing) {
                    ctx.beginPath(); ctx.ellipse(0, 0, pr*2.2, pr*0.5, 0.2, 0, Math.PI*2);
                    ctx.strokeStyle = p.aura + (0.08 * pAlpha) + ")"; ctx.lineWidth = pr*0.15; ctx.stroke();
                }
                let atm = ctx.createRadialGradient(0,0, pr*0.6, 0,0, pr*1.6);
                atm.addColorStop(0, p.aura + (0.3 * pAlpha) + ")"); atm.addColorStop(1, p.aura + "0)");
                ctx.fillStyle = atm; ctx.beginPath(); ctx.arc(0,0, pr*1.6, 0, Math.PI*2); ctx.fill();
                
                ctx.rotate(time * p.rotSpeed);
                let core = ctx.createRadialGradient(-pr*0.3, -pr*0.3, 0, 0,0, pr);
                core.addColorStop(0, "#fff"); core.addColorStop(0.3, p.colors[0]); core.addColorStop(1, "#050510");
                ctx.fillStyle = core; ctx.beginPath(); ctx.arc(0,0, pr, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }

            if(isActive && bloomProgress > 0.01) {
                ctx.save(); ctx.translate(px, py);
                let fSize = pr * 0.7;
                let isBouquet = (p.rarity === "JARDIM GALÁCTICO");
                for(let i=0; i<p.quantity; i++) {
                    let offset = (p.quantity > 1) ? (i - (p.quantity-1)/2) * 0.7 : 0;
                    const { tx, ty, rot } = drawStem(ctx, 0, 0, fSize, bloomProgress, time, offset, isBouquet);
                    ctx.save(); ctx.translate(tx, ty); ctx.rotate(rot); ctx.scale(bloomProgress, bloomProgress);
                    drawFlower(ctx, p, fSize, time);
                    ctx.restore();
                }
                ctx.restore();
            }
        }

        function drawBackground() {
            let bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, width);
            bgGrad.addColorStop(0, '#0a0515');
            bgGrad.addColorStop(1, '#020105');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0,0, width, height);
        }

        function loop(time) {
            drawBackground();

            if(state === 'ZOOMING') {
                cam.x += (cam.targetX - cam.x) * 0.07; cam.y += (cam.targetY - cam.y) * 0.07;
                cam.zoom += (cam.targetZoom - cam.zoom) * 0.07; bloomProgress += (1 - bloomProgress) * 0.06;
            } else if(state === 'RETURNING') {
                cam.zoom += (0.8 - cam.zoom) * 0.1; bloomProgress += (0 - bloomProgress) * 0.15;
                if(bloomProgress < 0.01) { state = 'EXPLORING'; activePlanet = null; }
            } else {
                cam.x += vel.x; cam.y += vel.y; vel.x *= 0.94; vel.y *= 0.94;
            }

            let sX = Math.floor((cam.x - cx/cam.zoom)/CHUNK_SIZE), eX = Math.ceil((cam.x + cx/cam.zoom)/CHUNK_SIZE);
            let sY = Math.floor((cam.y - cy/cam.zoom)/CHUNK_SIZE), eY = Math.ceil((cam.y + cy/cam.zoom)/CHUNK_SIZE);

            for(let x=sX; x<=eX; x++) {
                for(let y=sY; y<=eY; y++) {
                    let key = `${x},${y}`; let chunk = chunks.get(key);
                    if(!chunk) { chunk = generateChunk(x,y); chunks.set(key, chunk); }
                    
                    ctx.fillStyle = "#fff";
                    chunk.stars.forEach(s => {
                        let sx = cx + (s.x - cam.x) * s.z * cam.zoom;
                        let sy = cy + (s.y - cam.y) * s.z * cam.zoom;
                        if(sx > 0 && sx < width && sy > 0 && sy < height) {
                            ctx.globalAlpha = 0.3 + Math.sin(time*0.001+s.phase)*0.5;
                            ctx.beginPath(); ctx.arc(sx, sy, s.size * cam.zoom, 0, Math.PI*2); ctx.fill();
                        }
                    });
                    ctx.globalAlpha = 1;
                    chunk.planets.forEach(p => drawPlanet(ctx, p, time, cam));
                }
            }
            requestAnimationFrame(loop);
        }

        let isDown = false, lastPos = {x:0, y:0}, startPos = {x:0, y:0};
        window.addEventListener('pointerdown', e => {
            if(state !== 'EXPLORING') return;
            isDown = true; lastPos = startPos = {x: e.clientX, y: e.clientY}; vel = {x:0, y:0};
        });
        window.addEventListener('pointermove', e => {
            if(!isDown) return;
            let dx = e.clientX - lastPos.x, dy = e.clientY - lastPos.y;
            cam.x -= dx/cam.zoom; cam.y -= dy/cam.zoom;
            vel = {x: -dx*0.15, y: -dy*0.15}; lastPos = {x:e.clientX, y:e.clientY};
        });
        window.addEventListener('pointerup', e => {
            if(!isDown) return; isDown = false;
            if(Math.hypot(e.clientX - startPos.x, e.clientY - startPos.y) < 10) checkClick(e.clientX, e.clientY);
        });

        function checkClick(mx, my) {
            for(let chunk of chunks.values()) {
                for(let p of chunk.planets) {
                    let px = cx + (p.x - cam.x) * cam.zoom; let py = cy + (p.y - cam.y) * cam.zoom;
                    if(Math.hypot(mx-px, my-py) < p.radius * cam.zoom * 2.5) {
                        activePlanet = p; state = 'ZOOMING';
                        
                        // CORREÇÃO DE CENTRALIZAÇÃO:
                        // cam.targetY ajustado para que o planeta fique no centro vertical, 
                        // subtraindo um pouco para a flor (que cresce para cima) ficar bem no meio da parte escura.
                        cam.targetX = p.x; 
                        cam.targetY = p.y - (height * 0.1 / cam.zoom); 
                        
                        // Redução suave no zoom para caber o buquê no mobile
                        cam.targetZoom = (height * 0.18) / p.radius; 

                        const rl = document.getElementById('rarity-label');
                        rl.innerText = p.rarity;
                        rl.className = 'rarity-tag' + (p.rarity === 'JARDIM GALÁCTICO' ? ' galactico' : (p.isSpecial ? ' special' : ''));
                        document.getElementById('flower-name').innerText = p.nome;
                        document.getElementById('flower-desc').innerText = p.mensagem;
                        document.getElementById('ui-layer').classList.add('active');
                        return;
                    }
                }
            }
        }

        document.getElementById('btn-back').onclick = () => {
            state = 'RETURNING'; document.getElementById('ui-layer').classList.remove('active');
        };

        requestAnimationFrame(loop);
    </script>
</body>
</html>
