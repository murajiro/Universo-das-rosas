<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universo de Flores Infinito</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #020105;
            overflow: hidden;
            touch-action: none; 
            overscroll-behavior: none;
            font-family: 'Inter', sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 40px 20px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        #ui-layer.active {
            opacity: 1;
            pointer-events: auto;
        }

        .content-card {
            max-width: 600px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            background: linear-gradient(to bottom, rgba(2, 1, 5, 0.98) 0%, rgba(2, 1, 5, 0.6) 100%);
            padding: 25px 20px;
            border-radius: 24px;
            transform: translateY(-20px);
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #ui-layer.active .content-card {
            transform: translateY(0);
        }

        .rarity-tag {
            display: inline-block;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.08);
            color: #ffd700;
        }

        .rarity-tag.special {
            background: rgba(0, 242, 255, 0.15);
            color: #00f2ff;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
            border: 1px solid rgba(0, 242, 255, 0.3);
            font-weight: bold;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.2;
            text-shadow: 0 0 25px rgba(0, 242, 255, 0.3);
        }

        p {
            font-size: clamp(1rem, 4vw, 1.2rem);
            line-height: 1.6;
            font-weight: 400;
            opacity: 0.9;
            margin-bottom: 25px;
            font-style: italic;
            font-family: 'Playfair Display', serif;
            color: #e0faff;
        }

        .btn-back {
            appearance: none;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 14px 32px;
            border-radius: 40px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .btn-back:hover, .btn-back:active {
            background: rgba(0, 242, 255, 0.2);
            border-color: #00f2ff;
            transform: scale(1.05);
        }

        .touch-hint {
            font-size: 0.7rem;
            color: #00f2ff;
            margin-top: 15px;
            opacity: 0.8;
            letter-spacing: 1px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 1; text-shadow: 0 0 10px #00f2ff; transform: scale(1); }
        }
    </style>
</head>
<body>

    <canvas id="universe"></canvas>

    <div id="ui-layer">
        <div class="content-card">
            <div id="rarity-label" class="rarity-tag">COMUM</div>
            <h1 id="flower-name">Nome da Flor</h1>
            <p id="flower-desc">Descrição.</p>
            <button class="btn-back" id="btn-back">Explorar Mais</button>
            <div id="interaction-hint" class="touch-hint" style="display:none;">✧ Toque na rosa para soltar uma pétala ✧</div>
        </div>
    </div>

    <script>
        /** * DADOS DA FLORA CÓSMICA */
        const flowerData = [
            { id: 'rosa', nome: 'Rosa de Plasma', colors: ['#ff1a4a', '#800020', '#ffccd5'], aura: 'rgba(255, 26, 74, ', mensagem: "Uma nebulosa em forma de pétalas que queima com o calor de mil sóis." },
            { id: 'girassol', nome: 'Pulsar Dourado', colors: ['#ffaa00', '#4d3300', '#fff9e6'], aura: 'rgba(255, 170, 0, ', mensagem: "As sementes deste girassol são anãs brancas colidindo em harmonia." },
            { id: 'lavanda', nome: 'Eter de Lavanda', colors: ['#9d4dff', '#330066', '#e6d4ff'], aura: 'rgba(157, 77, 255, ', mensagem: "Ondas gravitacionais que exalam o perfume do infinito." },
            { id: 'tulipa', nome: 'Cálice de Quasar', colors: ['#00e6e6', '#004d4d', '#e6ffff'], aura: 'rgba(0, 230, 230, ', mensagem: "Uma flor que dobra o tempo e o espaço dentro de seu brilho ciano." },
            { id: 'lirio', nome: 'Lírio de Antimatéria', colors: ['#ffffff', '#2a0052', '#a000ff'], aura: 'rgba(160, 0, 255, ', mensagem: "Suas pétalas puras desafiam a lógica da matéria convencional." },
            { id: 'orquidea', nome: 'Orquídea de Eventos', colors: ['#000000', '#001a33', '#00ffff'], aura: 'rgba(0, 255, 255, ', mensagem: "Nascida no horizonte de eventos, onde o tempo para e a beleza é eterna." }
        ];

        const BLUE_ROSE_DATA = {
            id: 'blue-rose',
            nome: 'A Rosa do Impossível',
            colors: ['#00f2ff', '#003366', '#ffffff'],
            aura: 'rgba(0, 242, 255, ',
            mensagem: "A rosa azul simboliza o impossível, o inalcançável, mas por você eu farei o impossível infinitas vezes. Vou te amar até que essa flor não tenha mais pétalas.",
            rarity: 'SINGULARIDADE'
        };

        /** * SETUP E RESPONSIVIDADE */
        const canvas = document.getElementById('universe');
        const ctx = canvas.getContext('2d');
        let width, height, cx, cy;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        // Ajuste de escala baseado no dispositivo
        let CHUNK_SIZE = isMobile ? 1200 : 2500; 
        let PLANET_SCALE = isMobile ? 1.5 : 1.0; 

        let cam = { x: 0, y: 0, zoom: 1, targetX: 0, targetY: 0, targetZoom: 1 };
        let vel = { x: 0, y: 0 };
        let state = 'EXPLORING'; 
        let activePlanet = null;
        let bloomProgress = 0; 
        let fallingPetals = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * (window.devicePixelRatio || 1);
            canvas.height = height * (window.devicePixelRatio || 1);
            ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
            cx = width / 2; cy = height / 2;
            
            // Re-detectar se é mobile na mudança de orientação
            isMobile = width < 768;
            CHUNK_SIZE = isMobile ? 1200 : 2500;
            PLANET_SCALE = isMobile ? 1.5 : 1.0;
        }
        window.addEventListener('resize', resize);
        resize();

        const chunks = new Map();

        function createPRNG(x, y) {
            let seed = (x * 374761393 + y * 668265263) >>> 0;
            return function() {
                seed = (seed + 0x9E3779B9) | 0;
                let t = seed ^ (seed >>> 16);
                t = Math.imul(t, 0x21f0aaad);
                t = t ^ (t >>> 15);
                t = Math.imul(t, 0x735a2d97);
                seed = t = t ^ (t >>> 15);
                return (t >>> 0) / 4294967296;
            };
        }

        function generateChunk(cx_idx, cy_idx) {
            let chunkStars = [];
            let chunkPlanets = [];
            const random = createPRNG(cx_idx, cy_idx);

            // Menos estrelas no mobile para performance
            let starCount = isMobile ? 60 : 150;
            for(let i=0; i<starCount; i++) {
                chunkStars.push({
                    x: cx_idx * CHUNK_SIZE + random() * CHUNK_SIZE,
                    y: cy_idx * CHUNK_SIZE + random() * CHUNK_SIZE,
                    z: random() * 0.8 + 0.2,
                    size: random() * 1.5 + 0.5,
                    phase: random() * Math.PI * 2
                });
            }

            // Alta taxa de aparição
            if(random() < 0.85) {
                const isSpecial = random() < 0.15; // 15% de chance da Rosa Azul no mobile/ajustado
                
                if(isSpecial) {
                    chunkPlanets.push({
                        ...BLUE_ROSE_DATA,
                        x: cx_idx * CHUNK_SIZE + CHUNK_SIZE * 0.2 + random() * (CHUNK_SIZE * 0.6),
                        y: cy_idx * CHUNK_SIZE + CHUNK_SIZE * 0.2 + random() * (CHUNK_SIZE * 0.6),
                        radius: (80 + random() * 20) * PLANET_SCALE,
                        seed: random() * 1000,
                        rotSpeed: 0.002,
                        quantity: 1,
                        isSpecial: true
                    });
                } else {
                    let typeIdx = Math.floor(random() * flowerData.length);
                    let rVal = random();
                    let quantity = 1;
                    let rarity = "COMUM";
                    if(rVal > 0.95) { quantity = 3; rarity = "TRIO RARO"; }
                    else if(rVal > 0.80) { quantity = 2; rarity = "DUETO INCOMUM"; }

                    chunkPlanets.push({
                        ...flowerData[typeIdx],
                        x: cx_idx * CHUNK_SIZE + CHUNK_SIZE * 0.15 + random() * (CHUNK_SIZE * 0.7),
                        y: cy_idx * CHUNK_SIZE + CHUNK_SIZE * 0.15 + random() * (CHUNK_SIZE * 0.7),
                        radius: (60 + random() * 30) * PLANET_SCALE,
                        seed: random() * 1000,
                        rotSpeed: (random() - 0.5) * 0.004,
                        quantity,
                        rarity
                    });
                }
            }
            return { stars: chunkStars, planets: chunkPlanets };
        }

        /** * ARTES BOTÂNICAS */
        function drawDome(ctx, size, bloom) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(0, -size * 0.4, size * 2.3, Math.PI, 0);
            let grad = ctx.createLinearGradient(-size, -size * 2, size, 0);
            grad.addColorStop(0, 'rgba(255, 255, 255, ' + (0.5 * bloom) + ')');
            grad.addColorStop(0.5, 'rgba(255, 255, 255, 0)');
            grad.addColorStop(1, 'rgba(0, 242, 255, ' + (0.2 * bloom) + ')');
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2.5;
            ctx.stroke();
            let domeG = ctx.createRadialGradient(0, -size, 0, 0, -size, size * 2.3);
            domeG.addColorStop(0, 'rgba(255, 255, 255, 0)');
            domeG.addColorStop(0.9, 'rgba(0, 242, 255, ' + (0.1 * bloom) + ')');
            domeG.addColorStop(1, 'rgba(0, 242, 255, ' + (0.2 * bloom) + ')');
            ctx.fillStyle = domeG;
            ctx.fill();
            ctx.restore();
        }

        function drawBlueRose(ctx, r, colors, bloom, time) {
            const glowPulse = Math.sin(time * 0.002) * 10;
            ctx.shadowBlur = (20 + glowPulse) * bloom;
            ctx.shadowColor = colors[0];
            for(let layer=0; layer<5; layer++) {
                let petalCount = 7 + layer * 2;
                let layerR = r * (1.2 - layer * 0.2);
                for(let i=0; i<petalCount; i++) {
                    ctx.save();
                    ctx.rotate((i * (Math.PI*2/petalCount)) + layer * 0.4 + time * 0.0005);
                    ctx.beginPath();
                    ctx.moveTo(0,0);
                    ctx.bezierCurveTo(layerR * 0.8, -layerR*0.6, layerR*1.8, layerR*1.2, 0, layerR * 1.5);
                    ctx.bezierCurveTo(-layerR*1.8, layerR*1.2, -layerR*0.8, -layerR*0.6, 0, 0);
                    let g = ctx.createRadialGradient(0,0,0,0,0,layerR * 1.5);
                    g.addColorStop(0, colors[2]); 
                    g.addColorStop(0.4, colors[0]); 
                    g.addColorStop(1, colors[1]);
                    ctx.fillStyle = g; 
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.2 * bloom) + ')';
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                    ctx.restore();
                }
            }
            ctx.shadowBlur = 0;
        }

        function drawFlowerByType(ctx, p, size) {
            if(p.id === 'rosa') drawRose(ctx, size, p.colors);
            else if(p.id === 'tulipa') drawTulip(ctx, size, p.colors);
            else if(p.id === 'girassol') drawSunflower(ctx, size, p.colors);
            else if(p.id === 'lavanda') drawLavender(ctx, size, p.colors);
            else if(p.id === 'lirio') drawLily(ctx, size, p.colors);
            else if(p.id === 'orquidea') drawOrchid(ctx, size, p.colors);
        }

        // Funções auxiliares de desenho (Simplificadas para mobile)
        function drawRose(ctx, r, colors) { for(let l=0;l<3;l++){let pc=5+l*2;let lr=r*(1-l*0.25);for(let i=0;i<pc;i++){ctx.save();ctx.rotate((i*(Math.PI*2/pc))+l);ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(lr,-lr*0.5,lr*1.5,lr*0.8,0,lr);ctx.bezierCurveTo(-lr*1.5,lr*0.8,-lr,-lr*0.5,0,0);let g=ctx.createRadialGradient(0,0,0,0,0,lr);g.addColorStop(0,colors[2]);g.addColorStop(0.5,colors[0]);g.addColorStop(1,colors[1]);ctx.fillStyle=g;ctx.fill();ctx.restore();}} }
        function drawTulip(ctx, r, colors) { r*=1.1; for(let d of [-1,1]){ ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(d*r*0.9, -r*0.3, d*r, r*1.3, 0, r*1.6); ctx.bezierCurveTo(-d*r*0.3, r*0.9, 0, r*0.3, 0, 0); let g = ctx.createLinearGradient(0,0,d*r,r); g.addColorStop(0, colors[0]); g.addColorStop(1, colors[1]); ctx.fillStyle = g; ctx.fill(); } ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(r*0.5, r*0.8, 0, r*1.7); ctx.quadraticCurveTo(-r*0.5, r*0.8, 0, 0); ctx.fillStyle = colors[2]; ctx.fill(); }
        function drawSunflower(ctx, r, colors) { for(let i=0; i<16; i++) { ctx.save(); ctx.rotate(i * Math.PI/8); ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(r*0.4, r*0.5, 0, r * (i%2==0?1.2:1.0)); ctx.quadraticCurveTo(-r*0.4, r*0.5, 0, 0); ctx.fillStyle = i%2==0 ? colors[0] : colors[2]; ctx.fill(); ctx.restore(); } ctx.beginPath(); ctx.arc(0,0,r*0.4,0,Math.PI*2); ctx.fillStyle = colors[1]; ctx.fill(); }
        function drawLavender(ctx, r, colors) { for(let i=0; i<12; i++) { let y = -i * (r*0.18); let scale = (1 - (i/15)); ctx.save(); ctx.translate(0, y); for(let side of [-1, 1]) { ctx.beginPath(); ctx.ellipse(side * r*0.12, 0, r*0.22 * scale, r*0.12 * scale, side * 0.5, 0, Math.PI*2); ctx.fillStyle = colors[0]; ctx.fill(); } ctx.restore(); } }
        function drawLily(ctx, r, colors) { for(let i=0; i<6; i++) { ctx.save(); ctx.rotate(i * Math.PI/3); ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(r*0.4, r*0.2, r*0.3, r*1.5, 0, r*1.8); ctx.bezierCurveTo(-r*0.3, r*1.5, -r*0.4, r*0.2, 0, 0); let g = ctx.createLinearGradient(0, 0, 0, r*1.8); g.addColorStop(0, colors[1]); g.addColorStop(1, colors[0]); ctx.fillStyle = g; ctx.fill(); ctx.restore(); } }
        function drawOrchid(ctx, r, colors) { for(let i=0; i<3; i++) { ctx.save(); ctx.rotate(i * (Math.PI*2/3)); ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(r*0.8, r*0.1, r*0.5, r*1.4); ctx.quadraticCurveTo(-r*0.8, r*0.1, 0, 0); ctx.fillStyle = colors[1]; ctx.fill(); ctx.restore(); } ctx.beginPath(); ctx.arc(0, 0, r*0.2, 0, Math.PI*2); ctx.fillStyle = colors[2]; ctx.fill(); }

        function drawStem(ctx, x, y, size, bloom, time, angleOffset = 0) {
            const len = size * 2.2 * bloom;
            const sway = Math.sin(time * 0.001 + angleOffset) * 10 * bloom;
            const targetX = x + (angleOffset * size * 1.5) * bloom + sway;
            const targetY = y - len;
            ctx.beginPath();
            ctx.moveTo(x, y + size * 0.2); 
            ctx.bezierCurveTo(x, y, targetX - sway * 0.5, targetY + len * 0.4, targetX, targetY);
            ctx.strokeStyle = '#2d5a27';
            ctx.lineWidth = Math.max(2, size * 0.1 * bloom);
            ctx.lineCap = 'round';
            ctx.stroke();
            return { topX: targetX, topY: targetY, rotation: (angleOffset * 0.4) + (sway * 0.02) };
        }

        /** * RENDER PLANETA */
        function drawPlanet(ctx, p, time, cam) {
            let px = cx + (p.x - cam.x) * cam.zoom;
            let py = cy + (p.y - cam.y) * cam.zoom;
            let pr = Math.max(0, p.radius * cam.zoom);

            if (px < -pr*4 || px > width+pr*4 || py < -pr*4 || py > height+pr*4) return;

            let isActive = (activePlanet === p);
            let pAlpha = isActive ? Math.max(0, 1 - bloomProgress * 2.5) : 1;

            if (pAlpha > 0.001) {
                ctx.save();
                ctx.translate(px, py);
                let atmRadiusOuter = pr * (p.isSpecial ? 1.8 : 1.4);
                let atm = ctx.createRadialGradient(0, 0, pr * 0.5, 0, 0, atmRadiusOuter);
                atm.addColorStop(0, p.aura + (0.5 * pAlpha) + ')');
                atm.addColorStop(1, p.aura + '0)');
                ctx.fillStyle = atm;
                ctx.beginPath(); ctx.arc(0, 0, atmRadiusOuter, 0, Math.PI * 2); ctx.fill();
                
                ctx.rotate(time * p.rotSpeed);
                let core = ctx.createRadialGradient(-pr*0.3, -pr*0.3, 0, 0, 0, pr);
                if(p.isSpecial) {
                    core.addColorStop(0, '#ffffff'); core.addColorStop(0.2, '#00f2ff'); core.addColorStop(1, '#000b1a');
                } else {
                    core.addColorStop(0, '#ffffff'); core.addColorStop(0.3, p.colors[0]); core.addColorStop(1, '#000000');
                }
                ctx.fillStyle = core;
                ctx.beginPath(); ctx.arc(0, 0, pr, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }

            if (isActive && bloomProgress > 0.001) {
                ctx.save();
                ctx.translate(px, py);
                let baseSize = pr * 0.85;
                if(p.isSpecial) drawDome(ctx, pr, bloomProgress);
                for(let q=0; q < p.quantity; q++) {
                    ctx.save();
                    let angleOffset = (p.quantity > 1) ? (q - (p.quantity - 1) / 2) * 0.8 : 0;
                    const { topX, topY, rotation } = drawStem(ctx, 0, 0, baseSize, bloomProgress, time, angleOffset);
                    ctx.translate(topX, topY);
                    ctx.scale(Math.max(0.001, bloomProgress), Math.max(0.001, bloomProgress));
                    ctx.rotate(rotation);
                    if(p.isSpecial) drawBlueRose(ctx, baseSize, p.colors, bloomProgress, time);
                    else drawFlowerByType(ctx, p, baseSize);
                    ctx.restore();
                }
                ctx.restore();
            }
        }

        /** * LOOP */
        function loop(time) {
            ctx.fillStyle = '#020105';
            ctx.fillRect(0, 0, width, height);

            if (state === 'ZOOMING') {
                cam.x += (cam.targetX - cam.x) * 0.1;
                cam.y += (cam.targetY - cam.y) * 0.1;
                cam.zoom += (cam.targetZoom - cam.zoom) * 0.1;
                bloomProgress += (1 - bloomProgress) * 0.05;
            } else if (state === 'RETURNING') {
                cam.zoom += (1 - cam.zoom) * 0.1;
                bloomProgress += (0 - bloomProgress) * 0.1;
                if(bloomProgress < 0.01) { state = 'EXPLORING'; activePlanet = null; fallingPetals = []; }
            } else {
                cam.x += vel.x; cam.y += vel.y;
                vel.x *= 0.95; vel.y *= 0.95;
            }

            let startX = Math.floor((cam.x - (width/2)/cam.zoom)/CHUNK_SIZE);
            let endX = Math.ceil((cam.x + (width/2)/cam.zoom)/CHUNK_SIZE);
            let startY = Math.floor((cam.y - (height/2)/cam.zoom)/CHUNK_SIZE);
            let endY = Math.ceil((cam.y + (height/2)/cam.zoom)/CHUNK_SIZE);

            for(let x=startX; x<=endX; x++) {
                for(let y=startY; y<=endY; y++) {
                    let chunkKey = `${x},${y}`;
                    let chunk = chunks.get(chunkKey);
                    if(!chunk) { chunk = generateChunk(x,y); chunks.set(chunkKey, chunk); }
                    
                    chunk.stars.forEach(s => {
                        let sx = cx + (s.x - cam.x) * s.z * cam.zoom;
                        let sy = cy + (s.y - cam.y) * s.z * cam.zoom;
                        ctx.fillStyle = '#ffffff'; 
                        ctx.globalAlpha = 0.1 + Math.sin(time*0.001+s.phase)*0.3;
                        ctx.beginPath(); ctx.arc(sx, sy, s.size * cam.zoom, 0, Math.PI*2); ctx.fill();
                    });
                    ctx.globalAlpha = 1;
                    chunk.planets.forEach(p => drawPlanet(ctx, p, time, cam));
                }
            }

            fallingPetals = fallingPetals.filter(p => p.life > 0);
            fallingPetals.forEach(p => {
                p.y += p.vy; p.x += Math.sin(time*0.008 + p.offset) * 2;
                p.life -= 0.005; p.rot += 0.04;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.globalAlpha = p.life;
                ctx.shadowBlur = 8 * p.life;
                ctx.shadowColor = '#00f2ff';
                ctx.fillStyle = '#00f2ff';
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.bezierCurveTo(8*cam.zoom, -4*cam.zoom, 10*cam.zoom, 8*cam.zoom, 0, 10*cam.zoom);
                ctx.fill();
                ctx.restore();
            });
            ctx.globalAlpha = 1;

            requestAnimationFrame(loop);
        }

        /** * INPUTS MELHORADOS PARA TOUCH */
        let isDown = false, lastPos = {x:0,y:0};
        
        function handleStart(ex, ey) {
            if(state === 'ZOOMING' && activePlanet && activePlanet.isSpecial) {
                for(let i=0; i<2; i++) {
                    fallingPetals.push({
                        x: ex + (Math.random()-0.5)*30, y: ey + (Math.random()-0.5)*30,
                        vy: 0.8 + Math.random(), rot: Math.random()*Math.PI, 
                        life: 1.0, offset: Math.random()*1000
                    });
                }
                return;
            }
            if(state !== 'EXPLORING') return;
            isDown = true; lastPos = {x:ex, y:ey}; vel = {x:0, y:0};
        }

        function handleMove(ex, ey) {
            if(!isDown) return;
            let dx = ex - lastPos.x, dy = ey - lastPos.y;
            cam.x -= dx/cam.zoom; cam.y -= dy/cam.zoom;
            vel = {x: -dx*0.15, y: -dy*0.15};
            lastPos = {x:ex, y:ey};
        }

        function handleEnd(ex, ey) {
            if(!isDown) return; isDown = false;
            checkClick(ex, ey);
        }

        window.addEventListener('pointerdown', e => handleStart(e.clientX, e.clientY));
        window.addEventListener('pointermove', e => handleMove(e.clientX, e.clientY));
        window.addEventListener('pointerup', e => handleEnd(e.clientX, e.clientY));

        function checkClick(mx, my) {
            let startX = Math.floor((cam.x - (width/2)/cam.zoom)/CHUNK_SIZE);
            let endX = Math.ceil((cam.x + (width/2)/cam.zoom)/CHUNK_SIZE);
            let startY = Math.floor((cam.y - (height/2)/cam.zoom)/CHUNK_SIZE);
            let endY = Math.ceil((cam.y + (height/2)/cam.zoom)/CHUNK_SIZE);

            for(let x=startX; x<=endX; x++) {
                for(let y=startY; y<=endY; y++) {
                    let chunk = chunks.get(`${x},${y}`);
                    if(!chunk) continue;
                    for(let p of chunk.planets) {
                        let px = cx + (p.x - cam.x) * cam.zoom;
                        let py = cy + (p.y - cam.y) * cam.zoom;
                        // Área de toque maior no mobile (2.2x o raio)
                        let hitBox = p.radius * cam.zoom * (isMobile ? 2.2 : 1.6);
                        if(Math.hypot(mx-px, my-py) < hitBox) {
                            activePlanet = p; 
                            state = 'ZOOMING';
                            cam.targetX = p.x; 
                            cam.targetY = p.y - (isMobile ? 80 : 120);
                            cam.targetZoom = (height * (isMobile ? 0.35 : 0.23)) / p.radius;
                            
                            const rarityEl = document.getElementById('rarity-label');
                            rarityEl.innerText = p.rarity || 'COMUM';
                            rarityEl.className = 'rarity-tag' + (p.isSpecial ? ' special' : '');
                            
                            document.getElementById('flower-name').innerText = p.nome;
                            document.getElementById('flower-desc').innerText = p.mensagem;
                            document.getElementById('ui-layer').classList.add('active');
                            document.getElementById('interaction-hint').style.display = p.isSpecial ? 'block' : 'none';
                            return;
                        }
                    }
                }
            }
        }

        document.getElementById('btn-back').onclick = () => {
            state = 'RETURNING';
            document.getElementById('ui-layer').classList.remove('active');
        };

        requestAnimationFrame(loop);
    </script>
</body>
</html>
